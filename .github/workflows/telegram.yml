name: Telegram MTProto archive
on:
  workflow_dispatch:
  schedule:
    # UTC. 07:07 Moscow is 04:07 UTC. Every 30 minutes: 07 and 37 min each hour.
    - cron: '7,37 * * * *'
permissions:
  contents: write
concurrency:
  group: telegram-mtproto-collector
  cancel-in-progress: false
jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          persist-credentials: true
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install free MTProto library
        run: python -m pip install -r requirements.txt
      - name: Collect and generate reports
        env:
          TG_API_ID: ${{ secrets.TG_API_ID }}
          TG_API_HASH: ${{ secrets.TG_API_HASH }}
          TG_SESSION: ${{ secrets.TG_SESSION }}
        run: python collector.py
      - name: Commit public channel archives and reports (never secrets)
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add archive/ reports/ state.json
          if ! git diff --cached --quiet; then
            git commit -m "Update Telegram public-channel archive"
            git push
          fi
